services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=stock_ai
      - POSTGRES_USER=stock_ai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-stock_ai_dev}
    ports:
      - "5432:5432"
    volumes:
      - stock_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_ai -d stock_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_GATEWAY_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - gateway

  gateway:
    build:
      context: ./gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FRONTEND_ORIGIN=http://localhost:5173
      - AI_BACKEND_URL=http://ai-backend:8000
      - DATABASE_URL=postgresql://stock_ai:${POSTGRES_PASSWORD:-stock_ai_dev}@postgres:5432/stock_ai
    volumes:
      - ./gateway:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ai-backend:
        condition: service_started

  ai-backend:
    build:
      context: ./ai-backend
    ports:
      - "8000:8000"
    environment:
      - MCP_SERVER_URL=http://mcp-server:4100
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - NEBIUS_ENABLED=${NEBIUS_ENABLED:-true}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.studio.nebius.com/v1}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      - NEBIUS_MODEL_PORTFOLIO_SYNTHESIS=${NEBIUS_MODEL_PORTFOLIO_SYNTHESIS:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      - NEBIUS_MODEL_PORTFOLIO_RECOMMENDATION=${NEBIUS_MODEL_PORTFOLIO_RECOMMENDATION:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      - AGENT_MEMORY_DB=/app-data/agent_memory.db
      - QDRANT_PATH=/app-data/qdrant
    volumes:
      - ./ai-backend:/app
      - stock_ai_agent_data:/app-data
    depends_on:
      - mcp-server

  mcp-server:
    build:
      context: ./mcp-server
    ports:
      - "4100:4100"
    environment:
      - PORT=4100
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
    stdin_open: true
    tty: true
    volumes:
      - ./mcp-server:/app
      - /app/node_modules

volumes:
  stock_ai_postgres:
  stock_ai_agent_data:
